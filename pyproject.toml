[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lhdn-automation"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = [
    "selenium",
    "msal",
    "pywin32",
    "python-dotenv",
    "requests",
]

[project.scripts]
lhdn-automation = "lhdn_automation.main:main"
lhdn-automation-gui = "lhdn_automation.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
